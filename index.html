<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mama Laura HMS</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#123D8E"><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script></head><body class="bg-[#123D8E]">
<div id="loginPage" class="min-h-screen flex flex-col items-center justify-center p-4 bg-[#123D8E]">
<div class="bg-white rounded-[28px] p-8 w-full max-w-md shadow-2xl"><h1 class="text-center text-4xl font-black"><span class="text-[#1AAE4B]">MAMA</span> <span class="text-[#123D8E]">LAURA</span></h1><p class="text-center text-[11px] font-bold tracking-widest mt-1">MEDICAL CLINIC - SSP System</p><input id="em" placeholder="Email" class="w-full mt-8 p-3.5 border-2 border-black rounded-2xl outline-none"><input id="pw" type="password" placeholder="Password" class="w-full mt-3 p-3.5 border-2 rounded-2xl outline-none"><button onclick="doLogin()" class="w-full mt-5 bg-[#123D8E] text-white p-4 rounded-2xl font-black text-lg">LOGIN</button><p id="msg" class="text-red-600 text-xs mt-3 text-center"></p></div>
<div class="mt-6 text-center"><p class="text-[13px] font-bold"><span class="text-[#1AAE4B]">Developed</span> <span class="text-white"> by </span> <span class="text-[#1AAE4B]">E-Mutwokil</span> <span class="text-white"> Sadik</span></p></div></div>
<div id="app" class="hidden"><header class="bg-[#123D8E] text-white p-3 flex justify-between"><div><b>MAMA LAURA HMS</b> <span id="rb" class="bg-[#1AAE4B] text-[10px] px-2 py-1 rounded-full ml-2"></span></div><div><span id="un" class="text-xs"></span> <button onclick="auth.signOut().then(()=>location.reload())" class="bg-white/20 px-3 py-1 rounded text-xs ml-2">Logout</button></div></header>
<div class="max-w-7xl mx-auto p-3 grid grid-cols-12 gap-3"><div class="col-span-12 md:col-span-3"><div id="menu" class="bg-white rounded-2xl p-3"></div>
<div id="financeBox" class="hidden bg-white rounded-2xl p-4 mt-3"><h3 class="font-black text-sm text-[#123D8E]">Finance Admin SSP</h3><select id="pcat" class="w-full mt-2 p-2 border rounded text-xs"><option value="consultation">Consultation Fee</option><option value="lab">Lab Test</option><option value="bed">Bed Rental</option><option value="pharmacy">Pharmacy Drug</option></select><input id="plabel" placeholder="Label" class="w-full mt-2 p-2 border rounded text-xs"><input id="pprice" type="number" placeholder="Price SSP" class="w-full mt-2 p-2 border rounded text-xs"><button onclick="savePrice()" class="w-full mt-2 bg-[#1AAE4B] text-white p-2.5 rounded-xl font-bold text-xs">Save Price SSP</button><div id="plist" class="mt-3 text-[11px]"></div></div></div>
<div class="col-span-12 md:col-span-9 space-y-3">
<div id="p-reception" class="bg-white rounded-2xl p-5"><h2 class="font-black text-[#123D8E]">1. Reception</h2><div class="grid md:grid-cols-5 gap-2 mt-3 text-sm"><input id="pn" placeholder="Patient Name" class="p-2.5 border-2 rounded-xl"><input id="pa" type="number" placeholder="Age" class="p-2.5 border-2 rounded-xl"><select id="pg" class="p-2.5 border-2 rounded-xl"><option>Male</option><option>Female</option></select><select id="ps" class="p-2.5 border-2 rounded-xl"><option value="pediatrics">Pediatrics</option><option value="surgery">Surgery</option><option value="obgyn">OBGYN</option><option value="dermatology">Dermatology</option><option value="general">General</option></select><button onclick="reg()" class="bg-[#1AAE4B] text-white rounded-xl font-bold">Register</button></div><div id="rq" class="mt-4"></div></div>
<div id="p-doctor" class="bg-white rounded-2xl p-5 hidden"><h2 class="font-black">2. Specialist Agenda</h2><div id="da" class="mt-4"></div></div>
<div id="p-lab" class="bg-white rounded-2xl p-5 hidden"><h2 class="font-black">3. Lab</h2><div id="lq" class="mt-4"></div></div>
<div id="p-pharmacy" class="bg-white rounded-2xl p-5 hidden"><h2 class="font-black">4. Pharmacy SSP</h2><div id="phq" class="mt-4"></div></div>
<div id="p-nurse" class="bg-white rounded-2xl p-5 hidden"><h2 class="font-black">5. Nurse Tasks</h2><div id="nq" class="mt-4"></div></div>
<div id="p-admin" class="bg-white rounded-2xl p-5 hidden"><h2 class="font-black">6. Finance</h2><div id="aq" class="mt-4"></div></div>
</div></div><div class="text-center py-6 text-[12px] font-bold"><span class="text-[#1AAE4B]">Developed</span> <span class="text-white"> by </span> <span class="text-[#1AAE4B]">E-Mutwokil</span> <span class="text-white"> Sadik</span></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBTKKqbrmpF6BoCzN2gK72F9TwQ2YUkR4o",authDomain:"mama-laura-medical-cente-1fb61.firebaseapp.com",projectId:"mama-laura-medical-cente-1fb61",storageBucket:"mama-laura-medical-cente-1fb61.firebasestorage.app",messagingSenderId:"850931317131",appId:"1:850931317131:web:e74efd4bd588a52944d78e"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth();let me=null;
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
async function doLogin(){try{const c=await auth.signInWithEmailAndPassword(em.value.trim(),pw.value);const d=await db.collection('mama_staff').doc(c.user.uid).get();if(!d.exists){msg.textContent='No staff record - check Firestore';return;}me={uid:c.user.uid,...d.data()};document.getElementById('loginPage').classList.add('hidden');document.getElementById('app').classList.remove('hidden');un.textContent=me.name;rb.textContent=(me.role+' '+(me.specialty||'')).toUpperCase();buildMenu();loadAll();loadPrices();}catch(e){msg.textContent=e.message;}}
function buildMenu(){let h='';if(me.role==='reception'||me.role==='admin')h+=`<button onclick="show('reception')" class="w-full text-left p-3 rounded-xl bg-[#123D8E] text-white font-bold mt-1">📋 Reception</button>`;if(me.role==='doctor'||me.role==='admin')h+=`<button onclick="show('doctor')" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 mt-1">🩺 Specialist Agenda</button>`;if(me.role==='lab'||me.role==='admin')h+=`<button onclick="show('lab')" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 mt-1">🧪 Lab</button>`;if(me.role==='pharmacy'||me.role==='admin')h+=`<button onclick="show('pharmacy')" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 mt-1">💊 Pharmacy</button>`;if(me.role==='nurse'||me.role==='admin')h+=`<button onclick="show('nurse')" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 mt-1">👩‍⚕️ Nurse Tasks</button>`;if(me.role==='admin'){h+=`<button onclick="show('admin')" class="w-full text-left p-3 rounded-xl bg-[#1AAE4B] text-white font-bold mt-2">💰 Finance Admin SSP</button>`;financeBox.classList.remove('hidden');}menu.innerHTML=h;}
function show(id){['reception','doctor','lab','pharmacy','nurse','admin'].forEach(x=>{const e=document.getElementById('p-'+x);if(e)e.classList.add('hidden');});document.getElementById('p-'+id).classList.remove('hidden');}
async function savePrice(){const label=plabel.value.trim(),price=parseInt(pprice.value);if(!label||!price)return alert('Enter label & SSP price');await db.collection('mama_prices_ssp').doc(label.toLowerCase().replace(/[^a-z0-9]+/g,'_')).set({category:pcat.value,label,price,currency:'SSP',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});loadPrices();plabel.value='';pprice.value='';}
async function loadPrices(){const s=await db.collection('mama_prices_ssp').get();let h='';s.forEach(d=>{const v=d.data();h+=`<div class="flex justify-between border-b py-1"><span><b>${esc(v.label)}</b> (${esc(v.category)})</span><span>${Number(v.price).toLocaleString()} SSP</span></div>`;});plist.innerHTML=h||'No prices yet';}
async function reg(){const id='ML-'+Date.now();await db.collection('mama_patients').doc(id).set({id,name:pn.value.trim(),age:pa.value,gender:pg.value,specialty:ps.value,status:'waiting_specialist',createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('mama_appointments').doc(id).set({patientId:id,patientName:pn.value.trim(),specialty:ps.value,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});loadAll();}
async function loadAll(){loadReception();loadDoctor();loadLab();loadPharma();loadNurse();loadAdmin();}
async function loadReception(){const s=await db.collection('mama_patients').orderBy('createdAt','desc').limit(25).get();let h='<table class="w-full text-xs"><tr class="text-gray-400"><td>ID</td><td>Name</td><td>Spec</td><td>Status</td></tr>';s.forEach(d=>{const v=d.data();h+=`<tr class="border-b"><td>${esc(v.id)}</td><td>${esc(v.name)}</td><td>${esc(v.specialty)}</td><td>${esc(v.status)}</td></tr>`;});h+='</table>';rq.innerHTML=h;}
async function loadDoctor(){let q=db.collection('mama_patients');if(me.role==='doctor')q=q.where('specialty','==',me.specialty);const s=await q.orderBy('createdAt','desc').limit(20).get();let h='';s.forEach(d=>{const v=d.data();h+=`<div class="border-2 rounded-xl p-3 mt-2"><b>${esc(v.id)} - ${esc(v.name)}</b> <span class="text-[10px] bg-yellow-100 px-2 py-1 rounded">${esc(v.status)}</span><div class="grid grid-cols-2 gap-2 mt-2 text-xs"><input id="d_${d.id}" placeholder="Diagnosis" class="p-2 border rounded"><input id="lt_${d.id}" placeholder="Lab test" class="p-2 border rounded"></div><div class="mt-2 flex gap-2"><button onclick="toLab('${d.id}')" class="bg-[#123D8E] text-white px-3 py-1 rounded text-xs">Send to Lab</button><button onclick="toPharm('${d.id}')" class="bg-[#1AAE4B] text-white px-3 py-1 rounded text-xs">Pharmacy</button><button onclick="toNurse('${d.id}')" class="bg-blue-600 text-white px-3 py-1 rounded text-xs">Assign Nurse</button></div></div>`;});da.innerHTML=h||'No patients';}
async function toLab(pid){const t=document.getElementById('lt_'+pid).value;if(!t)return;await db.collection('mama_lab').doc(pid+'_'+Date.now()).set({patientId:pid,testName:t,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('mama_patients').doc(pid).update({status:'in_lab'});loadAll();}
async function toPharm(pid){const d=document.getElementById('d_'+pid).value;if(!d)return;await db.collection('mama_pharmacy_queue').doc(pid+'_'+Date.now()).set({patientId:pid,diagnosis:d,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('mama_patients').doc(pid).update({status:'in_pharmacy'});loadAll();}
async function toNurse(pid){await db.collection('mama_nurse_tasks').doc(pid+'_'+Date.now()).set({patientId:pid,task:'Monitoring '+pid+' from admission to discharge',status:'active',admissionDate:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('mama_patients').doc(pid).update({status:'under_nurse_care'});loadAll();}
async function loadLab(){const s=await db.collection('mama_lab').where('status','==','pending').get();let h='';s.forEach(d=>{const v=d.data();h+=`<div class="border p-3 rounded-xl mt-2 flex justify-between text-sm"><span>${esc(v.patientId)} - ${esc(v.testName)}</span><span><input id="lr_${d.id}" placeholder="Result" class="p-1 border rounded text-xs"><button onclick="labDone('${d.id}','${v.patientId}')" class="bg-[#1AAE4B] text-white px-2 py-1 rounded text-xs ml-1">Return</button></span></div>`;});lq.innerHTML=h||'No pending labs';}
async function labDone(lid,pid){const r=document.getElementById('lr_'+lid).value;if(!r)return;await db.collection('mama_lab').doc(lid).update({status:'completed',result:r});await db.collection('mama_patients').doc(pid).update({status:'lab_completed'});loadLab();}
async function loadPharma(){const s=await db.collection('mama_pharmacy_queue').where('status','==','pending').get();let h='';s.forEach(d=>{const v=d.data();h+=`<div class="border p-3 rounded-xl mt-2 text-sm"><b>${esc(v.patientId)} - ${esc(v.diagnosis)}</b><div class="mt-2 flex gap-2"><input id="dn_${d.id}" placeholder="Drug" class="p-1 border rounded text-xs"><input id="dp_${d.id}" type="number" placeholder="SSP" class="p-1 border rounded text-xs w-24"><button onclick="dispense('${d.id}','${v.patientId}')" class="bg-[#1AAE4B] text-white px-2 py-1 rounded text-xs">Dispense SSP</button></div></div>`;});phq.innerHTML=h||'No prescriptions';}
async function dispense(id,pid){const drug=document.getElementById('dn_'+id).value;const price=parseInt(document.getElementById('dp_'+id).value||0);if(!drug||!price)return;await db.collection('mama_pharmacy_queue').doc(id).update({status:'dispensed',drug,priceSSP:price});await db.collection('mama_patients').doc(pid).update({status:'pharmacy_dispensed'});loadPharma();}
async function loadNurse(){const s=await db.collection('mama_nurse_tasks').where('status','==','active').limit(25).get();let h='';s.forEach(d=>{const v=d.data();h+=`<div class="border p-3 rounded-xl mt-2 text-sm"><b>${esc(v.patientId)}</b> ${esc(v.task)}<br><button onclick="discharge('${d.id}','${v.patientId}')" class="bg-green-600 text-white px-2 py-1 rounded text-xs mt-2">Discharge</button></div>`;});nq.innerHTML=h||'No active tasks';}
async function discharge(tid,pid){await db.collection('mama_nurse_tasks').doc(tid).update({status:'discharged',dischargeDate:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('mama_patients').doc(pid).update({status:'discharged'});loadNurse();}
async function loadAdmin(){const s=await db.collection('mama_patients').orderBy('createdAt','desc').limit(30).get();let h='<table class="w-full text-xs"><tr class="text-gray-400"><td>ID</td><td>Name</td><td>Spec</td><td>Status</td></tr>';s.forEach(d=>{const v=d.data();h+=`<tr class="border-b"><td>${esc(v.id)}</td><td>${esc(v.name)}</td><td>${esc(v.specialty)}</td><td>${esc(v.status)}</td></tr>`;});h+='</table>';aq.innerHTML=h;}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
</script></body></html>
